[project]
name = "perplexity-gateway"
version = "0.1.0"
description = "Gateway client for routing LLM calls through the Perplexity Gateway API"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perplexity_gateway"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
packages = ["perplexity_gateway"]
strict = true
